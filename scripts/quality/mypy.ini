# Progressive mypy baseline (task #399).
#
# Policy:
# - The global section stays permissive; only modules listed with
#   `strict = True` below are held to full strict checking.
# - New small, pure, well-tested modules SHOULD be added to the strict
#   list during code review (one [mypy-<module>] section each). This is
#   the incremental adoption path: new code can be held to stricter
#   typing without a mass legacy rewrite.
# - Suppressions must be narrow (`# type: ignore[code]` with the specific
#   error code) rather than blanket ignores.
# - mypy is pinned at 1.18.2 in CI: the last release line with
#   pure-Python dependencies (1.19+ requires the librt C extension;
#   2.x additionally requires the Rust-based ast_serialize parser).
#   Version bumps are deliberate decisions with a re-run of the local
#   battery, not silent floating pins.
[mypy]
python_version = 3.14
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

[mypy-scripts.quality.common]
strict = True

[mypy-worker.analytics_profiles]
strict = True

[mypy-worker.detection_performance]
strict = True

[mypy-scripts.release.production_policy]
strict = True

[mypy-scripts.ci.validate_delivery_checkpoint]
strict = True
