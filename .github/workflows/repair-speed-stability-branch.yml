name: Repair speed stability branch

on:
  push:
    branches:
      - agent/stabilize-track-speed-events

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-track-speed-events
          fetch-depth: 0

      - name: Repair transfer typos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              'worker/hls_motion_yolo_worker_events.py',
              'tests/test_worker_tracking_overlay.py',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('bbox_xxy', 'bbox_xyxy')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate worker
        shell: bash
        run: |
          python -m py_compile worker/hls_motion_yolo_worker_events.py
          python -m unittest tests.test_worker_tracking_overlay tests.test_worker_contract

      - name: Commit repaired files
        shell: bash
        run: |
          worker_hash=$(git hash-object worker/hls_motion_yolo_worker_events.py)
          tests_hash=$(git hash-object tests/test_worker_tracking_overlay.py)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/hls_motion_yolo_worker_events.py tests/test_worker_tracking_overlay.py
          git commit -m 'Worker: repair exact speed stability files' -m "worker=${worker_hash} tests=${tests_hash}"
          git push origin HEAD:agent/stabilize-track-speed-events
