name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact lowercase 40-character main commit SHA"
        required: true
        type: string
      canonical_issue:
        description: "Canonical GitHub Issue number bound by the merged Change Contract"
        required: true
        type: number
  workflow_call:
    inputs:
      commit_sha:
        description: "Exact lowercase 40-character main commit SHA"
        required: true
        type: string
      canonical_issue:
        description: "Canonical GitHub Issue number bound by the merged Change Contract"
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

concurrency:
  group: sea-speed-vps-production
  cancel-in-progress: false

jobs:
  # Sea Speed transparent flow markers (kept for contract tests):
  # Verify public protected production source
  # verify_source_protection.py
  # --require-context "Repository validation"
  # --require-context "quality-integration"
  # rev-list --first-parent refs/remotes/origin/main - target is not on current main first-parent history
  # --first-parent
  # verify_quality_status.py - quality-integration.yml
  # evaluate_production_policy.py --require-allow vars.SEA_SPEED_PRODUCTION_DELEGATION_V1 production-policy-decision.json
  # verify_source_protection.py - Repository validation + quality-integration
  # rev-list --first-parent refs/remotes/origin/main - target is not on current main first-parent history
  # Verify public protected production source
  # verify_quality_status.py - quality-integration.yml
  # evaluate_production_policy.py --require-allow - vars.SEA_SPEED_PRODUCTION_DELEGATION_V1
  # --first-parent
  deploy:
    name: Deploy exact main quality-approved commit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SEA_SPEED_REQUIRE_AUTH_BOUNDARY: "1"
      SEA_SPEED_AUTHENTIK_UPSTREAM: "http://10.123.239.102:19000"
      SEA_SPEED_WORKER_PRIVATE_LISTEN: "10.123.239.101:18080"
      SEA_SPEED_WORKER_PRIVATE_PEER: "10.123.239.102"

    steps:
      - name: Require execution from main workflow definition
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Deploy VPS must execute from the main workflow definition" >&2; exit 1; }

      - name: Check out current protected workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact release (shared)
        id: verify
        uses: ./.github/actions/verify-exact-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEA_SPEED_PRODUCTION_DELEGATION_V1: ${{ vars.SEA_SPEED_PRODUCTION_DELEGATION_V1 }}
        with:
          commit_sha: ${{ inputs.commit_sha }}
          canonical_issue: ${{ inputs.canonical_issue }}
          require_allow: 'true'

      - name: Require VPS contour in exact Change Contract
        env:
          VPS_REQUIRED: ${{ steps.verify.outputs.vps_required }}
        run: |
          set -euo pipefail
          [[ "$VPS_REQUIRED" == "true" ]] || { echo "Exact Change Contract does not require VPS deployment" >&2; exit 1; }

      - name: Validate deployment and provenance tooling
        run: |
          set -euo pipefail
          bash -n deploy/vps/deploy.sh
          bash -n deploy/vps/sea-speed-auth-cutover.sh
          python -m py_compile scripts/release/*.py scripts/quality/*.py scripts/operations/nginx_cam1_direct_h264.py scripts/operations/nginx_sea_speed_auth.py
          python scripts/quality/validate_quality_contracts.py
          python scripts/quality/validate_workflow_policy.py

      - name: Build exact deployment artifacts
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
        run: |
          python scripts/quality/build_exact_artifacts.py --source-commit "$DEPLOY_SHA" --output-dir dist/exact
          python scripts/quality/validate_exact_artifacts.py --manifest dist/exact/exact-artifacts.json

      - name: Build and validate quality evidence
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
        run: |
          python scripts/quality/build_quality_evidence.py --source-commit "$DEPLOY_SHA" --artifacts-manifest dist/exact/exact-artifacts.json --output dist/quality-evidence.json
          python scripts/quality/validate_quality_evidence.py --evidence dist/quality-evidence.json --artifacts-manifest dist/exact/exact-artifacts.json

      - name: Build release provenance v3
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "${DEPLOY_SHA}^")"
          python scripts/release/build_release_manifest.py \
            --component vps \
            --source-commit "$DEPLOY_SHA" \
            --base-commit "$BASE_SHA" \
            --policy-decision-evidence dist/production-policy-decision.json \
            --artifact "dist/exact/sea-speed-vps-${DEPLOY_SHA}.tar.gz" \
            --exact-artifacts-manifest dist/exact/exact-artifacts.json \
            --quality-evidence dist/quality-evidence.json \
            --state ready_for_deployment \
            --output dist/release-manifest-vps.json
          python scripts/release/validate_release_manifest.py dist/release-manifest-vps.json

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_PRIVATE_KEY" ]] || { echo "Missing VPS_SSH_PRIVATE_KEY" >&2; exit 1; }
          [[ -n "$VPS_SSH_KNOWN_HOSTS" ]] || { echo "Missing VPS_SSH_KNOWN_HOSTS" >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/sea-speed-deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/sea-speed-deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit and reconcile Road private M2M boundary
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" ]] || { echo "Missing VPS_HOST" >&2; exit 1; }
          [[ -n "$VPS_USER" ]] || { echo "Missing VPS_USER" >&2; exit 1; }
          ssh -i "$HOME/.ssh/sea-speed-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "SEA_SPEED_REQUIRE_AUTH_BOUNDARY='$SEA_SPEED_REQUIRE_AUTH_BOUNDARY' SEA_SPEED_AUTHENTIK_UPSTREAM='$SEA_SPEED_AUTHENTIK_UPSTREAM' SEA_SPEED_WORKER_PRIVATE_LISTEN='$SEA_SPEED_WORKER_PRIVATE_LISTEN' SEA_SPEED_WORKER_PRIVATE_PEER='$SEA_SPEED_WORKER_PRIVATE_PEER' bash -s -- '$DEPLOY_SHA'" \
            < deploy/vps/deploy.sh

      - name: Collect and validate deployment evidence
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/sea-speed-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cat /opt/sea-speed-deploy/state/deployment-manifest.json" > dist/deployment-manifest-vps.json
          python scripts/release/validate_deployment_manifest.py dist/deployment-manifest-vps.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dist/deployment-manifest-vps.json").read_text(encoding="utf-8"))
          checks = {item.get("name"): item.get("status") for item in data.get("checks", [])}
          if checks.get("auth_v1_road_private_m2m") != "passed":
              raise SystemExit("VPS deployment manifest lacks passed Road private M2M Auth v1 evidence")
          if data.get("runtimeVerified") is not True or data.get("state") != "runtime_verified":
              raise SystemExit("VPS deployment manifest is not runtime_verified")
          print("VPS Road private M2M deployment evidence valid")
          PY

      - name: Build typed execution audit
        run: |
          python scripts/release/build_execution_audit.py \
            --policy-decision dist/production-policy-decision.json \
            --release-manifest dist/release-manifest-vps.json \
            --deployment-manifest dist/deployment-manifest-vps.json \
            --output dist/execution-audit-vps.json

      - name: Upload release and deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sea-speed-vps-deployment-${{ steps.verify.outputs.deploy_sha }}
          path: |
            dist/production-policy-decision.json
            dist/release-manifest-vps.json
            dist/quality-evidence.json
            dist/exact/exact-artifacts.json
            dist/deployment-manifest-vps.json
            dist/execution-audit-vps.json
          retention-days: 30
          if-no-files-found: error

      - name: Deployment summary
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
          CANONICAL_ISSUE: ${{ inputs.canonical_issue }}
          PR_NUMBER: ${{ steps.policy.outputs.pr_number }}
          DECISION_ID: ${{ steps.verify.outputs.policy_decision_id }}
        run: |
          echo "### Sea Speed VPS deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical Issue: #$CANONICAL_ISSUE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merged PR: #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Aggregate quality gate: exact main push run verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source protection: public protected main with required checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Standing delegation policy decision: \`$DECISION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime state: verified by deployment manifest" >> "$GITHUB_STEP_SUMMARY"
