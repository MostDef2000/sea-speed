name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA with a successful aggregate quality gate"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: sea-speed-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact quality-approved commit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve exact deployment commit
        id: release
        env:
          INPUT_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          DEPLOY_SHA="${INPUT_COMMIT,,}"
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deployment commit must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          git fetch origin "$DEPLOY_SHA" --depth=2
          git checkout --detach "$DEPLOY_SHA"
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]]
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify aggregate quality status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python scripts/quality/verify_quality_status.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$DEPLOY_SHA" \
            --required-name quality-integration

      - name: Validate deployment and provenance tooling
        run: |
          set -euo pipefail
          bash -n deploy/vps/deploy.sh
          python -m py_compile \
            scripts/release/build_release_manifest.py \
            scripts/release/validate_release_manifest.py \
            scripts/release/validate_deployment_manifest.py \
            scripts/quality/*.py
          python scripts/quality/validate_quality_contracts.py
          python scripts/quality/validate_workflow_policy.py

      - name: Build exact deployment artifacts
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python scripts/quality/build_exact_artifacts.py \
            --source-commit "$DEPLOY_SHA" \
            --output-dir dist/exact
          python scripts/quality/validate_exact_artifacts.py \
            --manifest dist/exact/exact-artifacts.json

      - name: Build release provenance
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BASE_SHA="$(git rev-parse "${DEPLOY_SHA}^")"
          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$DEPLOY_SHA" | sed '/^$/d')
          ARGS=(
            scripts/release/build_release_manifest.py
            --component vps
            --source-commit "$DEPLOY_SHA"
            --base-commit "$BASE_SHA"
            --state ready_for_deployment
            --output dist/release-manifest-vps.json
          )
          for file in "${CHANGED_FILES[@]}"; do ARGS+=(--file "$file"); done
          python "${ARGS[@]}"
          python scripts/release/validate_release_manifest.py dist/release-manifest-vps.json

      - name: Build and validate quality evidence
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python scripts/quality/build_quality_evidence.py \
            --source-commit "$DEPLOY_SHA" \
            --artifacts-manifest dist/exact/exact-artifacts.json \
            --output dist/quality-evidence.json
          python scripts/quality/validate_quality_evidence.py \
            --evidence dist/quality-evidence.json \
            --artifacts-manifest dist/exact/exact-artifacts.json

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_PRIVATE_KEY" ]] || { echo "Missing VPS_SSH_PRIVATE_KEY" >&2; exit 1; }
          [[ -n "$VPS_SSH_KNOWN_HOSTS" ]] || { echo "Missing VPS_SSH_KNOWN_HOSTS" >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/sea-speed-deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/sea-speed-deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" ]] || { echo "Missing VPS_HOST" >&2; exit 1; }
          [[ -n "$VPS_USER" ]] || { echo "Missing VPS_USER" >&2; exit 1; }
          ssh -i "$HOME/.ssh/sea-speed-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$DEPLOY_SHA'" < deploy/vps/deploy.sh

      - name: Collect and validate deployment evidence
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/sea-speed-deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cat /opt/sea-speed-deploy/state/deployment-manifest.json" \
            > dist/deployment-manifest-vps.json
          python scripts/release/validate_deployment_manifest.py dist/deployment-manifest-vps.json

      - name: Upload release and deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-speed-vps-deployment-${{ steps.release.outputs.sha }}
          path: |
            dist/release-manifest-vps.json
            dist/quality-evidence.json
            dist/exact/exact-artifacts.json
            dist/deployment-manifest-vps.json
          retention-days: 30
          if-no-files-found: error

      - name: Deployment summary
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          echo "### Sea Speed VPS deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Aggregate quality gate: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment approval: production environment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime state: verified by deployment manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback: previous runtime-verified commit" >> "$GITHUB_STEP_SUMMARY"
