name: Request VPS deployment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

jobs:
  request:
    name: Validate canonical Issue deployment request
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, 'DEPLOY VPS ') }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.request.outputs.commit_sha }}
      canonical_issue: ${{ steps.request.outputs.canonical_issue }}
    steps:
      - name: Check out default branch request tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Parse fail-closed deployment request
        id: request
        run: |
          set -euo pipefail
          python scripts/release/parse_deployment_request.py \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

  deploy:
    name: Execute authorized VPS deployment
    needs: request
    uses: ./.github/workflows/deploy-vps.yml
    with:
      commit_sha: ${{ needs.request.outputs.commit_sha }}
      canonical_issue: ${{ fromJSON(needs.request.outputs.canonical_issue) }}
    secrets: inherit
