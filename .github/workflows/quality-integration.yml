name: Quality integration gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify-change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      runtime_required: ${{ steps.classify.outputs.runtime_required }}
      impact: ${{ steps.classify.outputs.impact }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Classify change lane and runtime need
        id: classify
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/ci/classify_change.py --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci/classify_change.py --github-output "$GITHUB_OUTPUT"
          fi

  static-contract-security:
    name: static-contract-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate pull request Change Contract
        if: github.event_name == 'pull_request'
        run: python scripts/ci/validate_change_contract.py --event "$GITHUB_EVENT_PATH"
      - name: Validate SDD repository and PR linkage
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python scripts/ci/validate_sdd.py --event "$GITHUB_EVENT_PATH"
          else
            python scripts/ci/validate_sdd.py
          fi
      - name: Validate repository and canonical contracts
        run: |
          set -euo pipefail
          python scripts/ci/validate_repo.py
          python scripts/ci/validate_contracts.py
          python scripts/quality/validate_quality_contracts.py
          python scripts/quality/validate_workflow_policy.py
      - name: Validate JSON and Python syntax
        run: |
          set -euo pipefail
          find data/contracts data/quality schemas -type f -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
          python -m py_compile scripts/quality/*.py scripts/release/*.py
      - name: Run repository behavioral tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v

  property-fuzz-reliability:
    name: property-fuzz-reliability
    needs: classify
    if: needs.classify.outputs.lane != 'FAST'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run deterministic property checks
        run: python scripts/quality/test_properties.py
      - name: Run deterministic fuzz and recovery checks
        run: python scripts/quality/test_fuzz_recovery.py
      - name: Run quality architecture tests
        run: python -W error::ResourceWarning -m unittest tests.quality.test_quality_architecture -v

  exact-artifact-e2e:
    name: exact-artifact-e2e
    needs: classify
    if: needs.classify.outputs.runtime_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build exact artifacts twice
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/quality/build_exact_artifacts.py --source-commit "$SOURCE_COMMIT" --output-dir dist/exact-a
          python scripts/quality/build_exact_artifacts.py --source-commit "$SOURCE_COMMIT" --output-dir dist/exact-b
          cmp "dist/exact-a/sea-speed-vps-${SOURCE_COMMIT}.tar.gz" "dist/exact-b/sea-speed-vps-${SOURCE_COMMIT}.tar.gz"
          cmp "dist/exact-a/sea-speed-edge-${SOURCE_COMMIT}.tar.gz" "dist/exact-b/sea-speed-edge-${SOURCE_COMMIT}.tar.gz"
          cmp dist/exact-a/exact-artifacts.json dist/exact-b/exact-artifacts.json
      - name: Validate exact artifact bytes
        run: python scripts/quality/validate_exact_artifacts.py --manifest dist/exact-a/exact-artifacts.json
      - name: Upload exact artifacts on failure or success
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sea-speed-exact-artifacts-${{ github.sha }}
          path: dist/exact-a
          retention-days: 14
          if-no-files-found: error

  release-deployment-evidence:
    name: release-deployment-evidence
    needs: classify
    if: needs.classify.outputs.runtime_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build exact release artifacts
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/quality/build_exact_artifacts.py --source-commit "$SOURCE_COMMIT" --output-dir dist/release
      - name: Generate quality evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/quality/build_quality_evidence.py \
            --source-commit "$SOURCE_COMMIT" \
            --artifacts-manifest dist/release/exact-artifacts.json \
            --output dist/quality-evidence.json
      - name: Validate release and deployment evidence
        run: |
          python scripts/quality/validate_exact_artifacts.py --manifest dist/release/exact-artifacts.json
          python scripts/quality/validate_quality_evidence.py \
            --evidence dist/quality-evidence.json \
            --artifacts-manifest dist/release/exact-artifacts.json
      - name: Upload quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sea-speed-quality-evidence-${{ github.sha }}
          path: |
            dist/release
            dist/quality-evidence.json
          retention-days: 30
          if-no-files-found: error

  quality-integration:
    name: quality-integration
    if: always()
    needs:
      - classify
      - static-contract-security
      - property-fuzz-reliability
      - exact-artifact-e2e
      - release-deployment-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate independent quality domains
        env:
          STATIC_RESULT: ${{ needs.static-contract-security.result }}
          RELIABILITY_RESULT: ${{ needs.property-fuzz-reliability.result }}
          ARTIFACT_RESULT: ${{ needs.exact-artifact-e2e.result }}
          EVIDENCE_RESULT: ${{ needs.release-deployment-evidence.result }}
          RUNTIME_REQUIRED: ${{ needs.classify.outputs.runtime_required }}
          LANE: ${{ needs.classify.outputs.lane }}
          IMPACT: ${{ needs.classify.outputs.impact }}
        run: |
          set -euo pipefail
          printf 'lane=%s impact=%s runtime_required=%s\n' "$LANE" "$IMPACT" "$RUNTIME_REQUIRED"
          printf 'static-contract-security=%s\n' "$STATIC_RESULT"
          printf 'property-fuzz-reliability=%s\n' "$RELIABILITY_RESULT"
          printf 'exact-artifact-e2e=%s\n' "$ARTIFACT_RESULT"
          printf 'release-deployment-evidence=%s\n' "$EVIDENCE_RESULT"
          [[ "$STATIC_RESULT" == success ]]
          if [[ "$LANE" == "FAST" ]]; then
            [[ "$RELIABILITY_RESULT" == success || "$RELIABILITY_RESULT" == skipped ]]
          else
            [[ "$RELIABILITY_RESULT" == success ]]
          fi
          if [[ "$RUNTIME_REQUIRED" == "true" ]]; then
            [[ "$ARTIFACT_RESULT" == success ]]
            [[ "$EVIDENCE_RESULT" == success ]]
          else
            [[ "$ARTIFACT_RESULT" == success || "$ARTIFACT_RESULT" == skipped ]]
            [[ "$EVIDENCE_RESULT" == success || "$EVIDENCE_RESULT" == skipped ]]
          fi
