name: Deploy Ubuntu Worker

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact lowercase 40-character main commit SHA"
        required: true
        type: string
      canonical_issue:
        description: "Canonical GitHub Issue number bound by the merged Change Contract"
        required: true
        type: number
  workflow_call:
    inputs:
      commit_sha:
        description: "Exact lowercase 40-character main commit SHA"
        required: true
        type: string
      canonical_issue:
        description: "Canonical GitHub Issue number bound by the merged Change Contract"
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

concurrency:
  group: sea-speed-ubuntu-worker-production
  cancel-in-progress: false

jobs:
  # Sea Speed transparent flow markers (kept for contract tests):
  # Verify public protected production source
  # verify_source_protection.py
  # --require-context "Repository validation"
  # --require-context "quality-integration"
  # rev-list --first-parent refs/remotes/origin/main - target is not on current main first-parent history
  # --first-parent
  # verify_quality_status.py - quality-integration.yml
  # evaluate_production_policy.py --require-allow vars.SEA_SPEED_PRODUCTION_DELEGATION_V1 production-policy-decision.json
  # verify_source_protection.py - Repository validation + quality-integration
  # rev-list --first-parent refs/remotes/origin/main - target is not on current main first-parent history
  # Verify public protected production source
  # verify_quality_status.py - quality-integration.yml
  # evaluate_production_policy.py --require-allow - vars.SEA_SPEED_PRODUCTION_DELEGATION_V1
  # --first-parent
  deploy:
    name: Deploy exact main quality-approved Ubuntu release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Require execution from main workflow definition
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Deploy Ubuntu Worker must execute from the main workflow definition" >&2; exit 1; }

      - name: Check out current protected workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact release (shared)
        id: verify
        uses: ./.github/actions/verify-exact-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEA_SPEED_PRODUCTION_DELEGATION_V1: ${{ vars.SEA_SPEED_PRODUCTION_DELEGATION_V1 }}
        with:
          commit_sha: ${{ inputs.commit_sha }}
          canonical_issue: ${{ inputs.canonical_issue }}
          require_allow: 'true'

      - name: Require Ubuntu contour in exact Change Contract
        env:
          UBUNTU_REQUIRED: ${{ steps.verify.outputs.ubuntu_worker_required }}
        run: |
          set -euo pipefail
          [[ "$UBUNTU_REQUIRED" == "true" ]] || { echo "Exact Change Contract does not require Ubuntu Worker deployment" >&2; exit 1; }

      - name: Validate Ubuntu deployment tooling
        run: |
          set -euo pipefail
          bash -n deploy/worker/ubuntu/deploy-authorized.sh
          bash -n deploy/worker/ubuntu/update-exact.sh
          bash -n deploy/worker/ubuntu/rollback-exact.sh
          python -m py_compile scripts/release/*.py scripts/quality/*.py
          python scripts/quality/validate_quality_contracts.py
          python scripts/quality/validate_workflow_policy.py

      - name: Build exact artifacts and Ubuntu release provenance
        id: exact
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          python scripts/quality/build_exact_artifacts.py --source-commit "$DEPLOY_SHA" --output-dir dist/exact
          python scripts/quality/validate_exact_artifacts.py --manifest dist/exact/exact-artifacts.json
          python scripts/quality/build_quality_evidence.py --source-commit "$DEPLOY_SHA" --artifacts-manifest dist/exact/exact-artifacts.json --output dist/quality-evidence.json
          python scripts/quality/validate_quality_evidence.py --evidence dist/quality-evidence.json --artifacts-manifest dist/exact/exact-artifacts.json
          ARTIFACT_SHA="$(python - <<'PY'
          import json
          m=json.load(open('dist/exact/exact-artifacts.json', encoding='utf-8'))
          u=next(a for a in m['release_artifacts'] if a['component']=='ubuntu-worker')
          print(u['sha256'])
          PY
          )"
          echo "artifact_sha256=$ARTIFACT_SHA" >> "$GITHUB_OUTPUT"
          BASE_SHA="$(git rev-parse "${DEPLOY_SHA}^")"
          python scripts/release/build_release_manifest.py \
            --component ubuntu-worker \
            --source-commit "$DEPLOY_SHA" \
            --base-commit "$BASE_SHA" \
            --policy-decision-evidence dist/production-policy-decision.json \
            --artifact "dist/exact/sea-speed-ubuntu-worker-${DEPLOY_SHA}.tar.gz" \
            --exact-artifacts-manifest dist/exact/exact-artifacts.json \
            --quality-evidence dist/quality-evidence.json \
            --state ready_for_deployment \
            --output dist/release-manifest-ubuntu-worker.json
          python scripts/release/validate_release_manifest.py dist/release-manifest-ubuntu-worker.json

      - name: Require provisioned zero-touch Ubuntu transport
        env:
          UBUNTU_DEPLOY_KEY: ${{ secrets.UBUNTU_DEPLOY_SSH_PRIVATE_KEY }}
          UBUNTU_KNOWN_HOSTS: ${{ secrets.UBUNTU_DEPLOY_SSH_KNOWN_HOSTS }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          [[ -n "$UBUNTU_DEPLOY_KEY" ]] || { echo "Missing UBUNTU_DEPLOY_SSH_PRIVATE_KEY" >&2; exit 42; }
          [[ -n "$UBUNTU_KNOWN_HOSTS" ]] || { echo "Missing UBUNTU_DEPLOY_SSH_KNOWN_HOSTS" >&2; exit 42; }
          [[ -n "$VPS_DEPLOY_KEY" ]] || { echo "Missing VPS_SSH_PRIVATE_KEY for ProxyJump" >&2; exit 42; }
          [[ -n "$VPS_KNOWN_HOSTS" ]] || { echo "Missing VPS_SSH_KNOWN_HOSTS for ProxyJump" >&2; exit 42; }
          [[ -n "$VPS_HOST" ]] || { echo "Missing VPS_HOST for ProxyJump" >&2; exit 42; }
          [[ -n "$VPS_USER" ]] || { echo "Missing VPS_USER for ProxyJump" >&2; exit 42; }
          echo "Ubuntu zero-touch transport capability: CONNECTOR"

      - name: Configure restricted VPS ProxyJump to Ubuntu Worker
        env:
          UBUNTU_DEPLOY_KEY: ${{ secrets.UBUNTU_DEPLOY_SSH_PRIVATE_KEY }}
          UBUNTU_KNOWN_HOSTS: ${{ secrets.UBUNTU_DEPLOY_SSH_KNOWN_HOSTS }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$UBUNTU_DEPLOY_KEY" > "$HOME/.ssh/sea-speed-ubuntu-deploy"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/sea-speed-vps-jump"
          printf '%s\n' "$UBUNTU_KNOWN_HOSTS" > "$HOME/.ssh/ubuntu_known_hosts"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/vps_known_hosts"
          chmod 0600 "$HOME/.ssh/sea-speed-ubuntu-deploy" "$HOME/.ssh/sea-speed-vps-jump" "$HOME/.ssh/ubuntu_known_hosts" "$HOME/.ssh/vps_known_hosts"
          cat > "$HOME/.ssh/sea-speed-production-config" <<EOF_CONFIG
          Host sea-speed-vps-jump
              HostName $VPS_HOST
              User $VPS_USER
              Port $VPS_PORT
              IdentityFile $HOME/.ssh/sea-speed-vps-jump
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              UserKnownHostsFile $HOME/.ssh/vps_known_hosts
              ForwardAgent no

          Host sea-speed-ubuntu-worker
              HostName 10.123.239.102
              User sea-speed-deploy
              Port 22
              IdentityFile $HOME/.ssh/sea-speed-ubuntu-deploy
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              UserKnownHostsFile $HOME/.ssh/ubuntu_known_hosts
              ProxyJump sea-speed-vps-jump
              RequestTTY no
              ForwardAgent no
              ClearAllForwardings yes
          EOF_CONFIG
          sed -i 's/^          //' "$HOME/.ssh/sea-speed-production-config"
          chmod 0600 "$HOME/.ssh/sea-speed-production-config"

      - name: Execute restricted Ubuntu deployment protocol
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
          CANONICAL_ISSUE: ${{ inputs.canonical_issue }}
          ARTIFACT_SHA: ${{ steps.exact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/sea-speed-production-config" sea-speed-ubuntu-worker \
            "sea-speed-ubuntu-deploy-v1 $DEPLOY_SHA $CANONICAL_ISSUE $ARTIFACT_SHA" \
            > dist/deployment-manifest-ubuntu-worker.json
          python scripts/release/validate_deployment_manifest.py dist/deployment-manifest-ubuntu-worker.json

      - name: Build typed execution audit
        run: |
          python scripts/release/build_execution_audit.py \
            --policy-decision dist/production-policy-decision.json \
            --release-manifest dist/release-manifest-ubuntu-worker.json \
            --deployment-manifest dist/deployment-manifest-ubuntu-worker.json \
            --output dist/execution-audit-ubuntu-worker.json

      - name: Upload Ubuntu release and deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sea-speed-ubuntu-deployment-${{ steps.verify.outputs.deploy_sha }}
          path: |
            dist/production-policy-decision.json
            dist/release-manifest-ubuntu-worker.json
            dist/quality-evidence.json
            dist/exact/exact-artifacts.json
            dist/deployment-manifest-ubuntu-worker.json
            dist/execution-audit-ubuntu-worker.json
          retention-days: 30
          if-no-files-found: warn

      - name: Deployment summary
        env:
          DEPLOY_SHA: ${{ steps.verify.outputs.deploy_sha }}
          CANONICAL_ISSUE: ${{ inputs.canonical_issue }}
          DECISION_ID: ${{ steps.verify.outputs.policy_decision_id }}
        run: |
          echo "### Sea Speed Ubuntu Worker deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical Issue: #$CANONICAL_ISSUE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Standing delegation policy decision: \`$DECISION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Execution: GitHub-hosted runner -> VPS ProxyJump -> ZeroTier -> restricted Ubuntu forced command" >> "$GITHUB_STEP_SUMMARY"
          echo "- Operator actions expected: 0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime state: verified by deployment manifest" >> "$GITHUB_STEP_SUMMARY"
