name: Deploy Ubuntu Worker

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact lowercase 40-character main commit SHA"
        required: true
        type: string
      canonical_issue:
        description: "Canonical GitHub Issue number carrying durable production authorization"
        required: true
        type: number
  workflow_call:
    inputs:
      commit_sha:
        description: "Exact lowercase 40-character main commit SHA"
        required: true
        type: string
      canonical_issue:
        description: "Canonical GitHub Issue number carrying durable production authorization"
        required: true
        type: number

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo compile-probe
