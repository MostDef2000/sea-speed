# Issue #477: tasks.md completion-marker sync must ride a PR.
#
# The previous revision pushed the sync commit directly to main with
# github.token; repository rulesets require PR checks, so a direct push can
# never satisfy them and the sync failed. This revision:
#   1. syncs markers on the exact merged head (guarded against stale
#      triggers by comparing main's tip with workflow_run.head_sha),
#   2. pushes the delta to the deterministic branch chore/tasks-md-auto-sync,
#   3. creates (or reuses) the auto-sync PR with a Change-Contract body
#      generated by scripts/ci/build_sync_pr_body.py, and
#   4. waits for the PR's own required checks, then squash-merges it.
# Loop safety (proven in tests/test_sync_tasks_md_flow.py): COMPLETION_RE
# matches only unchecked markers, so this PR's own squash merge to main
# re-triggers the sync, which then finds no delta and exits green.

name: Sync merged tasks.md

on:
  workflow_run:
    workflows:
      - Quality integration gate
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-merged-tasks
  cancel-in-progress: false

jobs:
  sync-merged-tasks:
    name: sync-merged-tasks
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main at the triggering merge head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 2

      - name: Guard against a stale trigger
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [[ "${current}" != "${HEAD_SHA}" ]]; then
            echo "main advanced past the triggering head (${current} != ${HEAD_SHA});"
            echo "the newer merge's sync run covers its own delta; this superseded"
            echo "merge's pending markers are re-examined only when that spec dir changes again."
            echo "HAS_DELTA=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "SOURCE_SHA=${HEAD_SHA}" >> "${GITHUB_ENV}"

      - name: Sync markers, verify freshness, build PR body (or exit when current)
        if: env.HAS_DELTA != 'false'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python scripts/ci/sync_tasks_md.py --base "${HEAD_SHA}^" --head "${HEAD_SHA}" --sha "${HEAD_SHA}"
          python scripts/ci/validate_sdd.py --freshness --base "${HEAD_SHA}^" --head "${HEAD_SHA}"
          # Delta = the ACTUAL working-tree result of the sync (git status,
          # filtered to the sync's own pathspec), not the merge's changed-dir
          # report: a flip inside a spec dir the merge touched only in
          # non-tasks.md files must still produce a PR, while a tasks.md the
          # merge touched with zero pending markers must produce none.
          mapfile -t changed < <(git status --porcelain -- ':(glob)specs/*/tasks.md' | cut -c4-)
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "tasks.md already current (or no recognizable markers to flip); nothing to sync"
            echo "HAS_DELTA=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          args=()
          for f in "${changed[@]}"; do
            echo "delta: ${f}"
            args+=(--changed-file "${f}")
          done
          python scripts/ci/build_sync_pr_body.py --source-sha "${HEAD_SHA}" "${args[@]}" \
            --out "${RUNNER_TEMP}/sync-pr-body.md"
          {
            echo "HAS_DELTA=true"
            echo "PR_BODY_FILE=${RUNNER_TEMP}/sync-pr-body.md"
          } >> "${GITHUB_ENV}"

      - name: Push sync branch and create or reuse the auto-sync PR
        if: env.HAS_DELTA == 'true'
        env:
          # RF-011: the PR author's identity decides the CI parking. PRs authored
          # by github-actions[bot] get their pull_request workflow runs
          # approval-parked; PRs authored by a collaborator (the owner's
          # fine-grained PAT stored as the SYNC_PR_TOKEN repo secret) run CI
          # immediately. Falls back to the workflow token when the secret is
          # absent (approval-dependent mode, see RF-010).
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BRANCH=chore/tasks-md-auto-sync
          git fetch origin "${BRANCH}" || echo "no existing ${BRANCH} on origin"
          git checkout -B "${BRANCH}"
          git config user.name "sea-speed-bot"
          git config user.email "bot@sea-speed.invalid"
          git add -- ':(glob)specs/*/tasks.md'
          git commit -m "chore(sdd): auto-sync tasks.md completion (${SOURCE_SHA:0:8})"
          # RF-015 (live, run 38560517415): a plain git-level push here uses
          # the checkout's GITHUB_TOKEN credentials, so the synchronize actor is
          # github-actions[bot] and GitHub parks the PR's pull_request runs in
          # `action_required` — the ruleset's statusCheckRollup never fills and
          # the final gate can never pass. Updating the ref via the REST API
          # under the SAME token as PR creation (the PAT fallback) makes the
          # synchronize actor a human collaborator, so PR-side CI runs unpaused.
          commit_sha="$(git rev-parse HEAD)"
          if gh api "repos/${GH_REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/heads/${BRANCH}" \
              -f "sha=${commit_sha}" -F "force=true" >/dev/null  # -F: typed boolean; -f sends the STRING "true" and the API rejects it (RF-016, run 38562706585)
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/heads/${BRANCH}" -f "sha=${commit_sha}" >/dev/null
          fi
          number="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${number}" ]]; then
            echo "reusing open auto-sync PR #${number}"
            # RF-014 (live): the gh edit command runs a GraphQL lookup that
            # demands read:org even for public repos — the owner's classic
            # PAT (public_repo) cannot run it. REST PATCH needs no extra scopes.
            gh api -X PATCH "repos/${GH_REPO}/pulls/${number}" \
              -f "title=chore(sdd): auto-sync tasks.md completion (${SOURCE_SHA:0:8})" \
              -F "body=@${PR_BODY_FILE}"
          else
            # gh pr create has no --json flag (any version); it prints the PR URL.
            url="$(gh pr create --head "${BRANCH}" --base main \
              --title "chore(sdd): auto-sync tasks.md completion (${SOURCE_SHA:0:8})" \
              --body-file "${PR_BODY_FILE}")"
            number="${url##*/}"
            echo "created auto-sync PR #${number} (${url})"
          fi
          echo "PR_NUMBER=${number}" >> "${GITHUB_ENV}"

      - name: Trigger and wait for the auto-sync PR required checks
        if: env.HAS_DELTA == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: chore/tasks-md-auto-sync
        run: |
          set -euo pipefail
          # Live finding (sync run on 9b3b873, PR #486): a PR created with
          # GITHUB_TOKEN emits no pull_request events, so PR-side CI never
          # starts on its own and `gh pr checks` exits 1 with "no checks
          # reported" — transient bookkeeping, not a failed check (D-11
          # extension). The flow therefore dispatches the two required-check
          # workflows on the sync-branch ref itself; their check runs attach
          # to the PR head SHA and satisfy the ruleset's required contexts.
          gh workflow run pr-validation.yml --ref "${BRANCH}"
          gh workflow run quality-integration.yml --ref "${BRANCH}"
          poll() {
            wf="$1"
            gh api "repos/${GH_REPO}/actions/runs?branch=${BRANCH}&per_page=30" \
              --jq "[.workflow_runs[] | select(.name == \"${wf}\" and .conclusion != \"action_required\")] | max_by(.run_number) | .conclusion // \"pending\""
          }
          deadline=$(( $(date +%s) + 1800 ))
          pr_concl="pending"; qi_concl="pending"
          while [[ "$(date +%s)" -lt "${deadline}" ]]; do
            pr_concl="$(poll "PR Validation")"
            qi_concl="$(poll "Quality integration gate")"
            echo "PR Validation=${pr_concl}; Quality integration gate=${qi_concl}"
            if [[ "${pr_concl}" == "success" && "${qi_concl}" == "success" ]]; then
              break
            fi
            case "${pr_concl}${qi_concl}" in
              *failure*|*cancelled*|*timed_out*|*startup_failure*)
                echo "::error::auto-sync PR #${PR_NUMBER} required checks failed (PR Validation=${pr_concl}, Quality integration gate=${qi_concl})"
                exit 1 ;;
            esac
            sleep 30
          done
          if [[ "${pr_concl}" != "success" || "${qi_concl}" != "success" ]]; then
            echo "::error::auto-sync PR #${PR_NUMBER} checks not green within 1800s (PR Validation=${pr_concl}, Quality integration gate=${qi_concl})"
            exit 1
          fi
          # Final gate consistent with the ruleset: required contexts green
          # on the PR head SHA. RF-015 (live): this gate is POLLED, not
          # one-shot — pull_request runs (which fill the statusCheckRollup)
          # complete later than the dispatched ones, and a one-shot call ~100 s
          # after the ref update saw "no checks reported" and failed a healthy
          # sync. "no checks reported" means pending registration (keep
          # waiting); any other failure exits loudly.
          gate_deadline=$(( $(date +%s) + 900 ))
          gate_green=0
          while [[ "$(date +%s)" -lt "${gate_deadline}" ]]; do
            gate_out="$(gh pr checks "${PR_NUMBER}" --required 2>&1)" && { gate_green=1; break; }
            case "${gate_out}" in
              *"no checks reported"*) : ;;
              *)
                printf '%s\n' "${gate_out}"
                echo "::error::auto-sync PR #${PR_NUMBER} final required-checks gate failed"
                exit 1 ;;
            esac
            sleep 30
          done
          if [[ "${gate_green}" != "1" ]]; then
            echo "::error::auto-sync PR #${PR_NUMBER} final required-checks gate not green within 900s"
            exit 1
          fi

      - name: Squash-merge the auto-sync PR
        if: env.HAS_DELTA == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "${PR_NUMBER}" --squash --delete-branch \
            --subject "chore(sdd): auto-sync tasks.md completion (${SOURCE_SHA:0:8})"
          echo "auto-sync PR #${PR_NUMBER} squash-merged; the follow-up sync run must report no delta"

      - name: Loud failure notice
        if: failure()
        run: |
          echo "::error::tasks.md auto-sync flow failed — inspect this run and https://github.com/${{ github.repository }}/pulls (head: chore/tasks-md-auto-sync); completing the sync manually is orchestrator-owned"
