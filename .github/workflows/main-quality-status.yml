name: Main Quality status publisher

on:
  workflow_run:
    workflows:
      - Quality integration gate
    types:
      - completed

permissions:
  statuses: write
  contents: write

jobs:
  publish-main-quality-status:
    name: publish-main-quality-status
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-main Quality commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing non-exact lowercase workflow_run head SHA" >&2
            exit 1
          fi
          if [[ "$RUN_CONCLUSION" == "success" ]]; then
            STATE="success"
          else
            STATE="failure"
          fi
          export STATE
          PAYLOAD="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": f"Quality #{os.environ['RUN_NUMBER']} run_id={os.environ['RUN_ID']} conclusion={os.environ['RUN_CONCLUSION']}",
              "context": "sea-speed/quality-push-main",
          }, separators=(",", ":")))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            --data "$PAYLOAD"

  sync-merged-tasks:
    name: sync-merged-tasks
    needs: publish-main-quality-status
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 2
      - name: Sync tasks.md completion markers and verify freshness
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python scripts/ci/sync_tasks_md.py --base "${HEAD_SHA}^" --head "${HEAD_SHA}" --sha "${HEAD_SHA}"
          python scripts/ci/validate_sdd.py --freshness --base "${HEAD_SHA}^" --head "${HEAD_SHA}"
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "sea-speed-bot"
            git config user.email "bot@sea-speed.invalid"
            git add -A
            git commit -m "chore(sdd): auto-sync tasks.md completion on merge to main"
            git push
          else
            echo "tasks.md already current; nothing to sync"
          fi
