name: Main Quality status publisher

on:
  workflow_run:
    workflows:
      - Quality integration gate
    types:
      - completed

permissions:
  statuses: write

jobs:
  publish-main-quality-status:
    name: publish-main-quality-status
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-main Quality commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing non-exact lowercase workflow_run head SHA" >&2
            exit 1
          fi
          if [[ "$RUN_CONCLUSION" == "success" ]]; then
            STATE="success"
          else
            STATE="failure"
          fi
          export STATE
          PAYLOAD="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": f"Quality #{os.environ['RUN_NUMBER']} run_id={os.environ['RUN_ID']} conclusion={os.environ['RUN_CONCLUSION']}",
              "context": "sea-speed/quality-push-main",
          }, separators=(",", ":")))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            --data "$PAYLOAD"
