name: Request runtime deployment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

jobs:
  request:
    name: Validate production authorization and execution intent
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, 'PRODUCTION APPROVED ') && contains(github.event.comment.body, 'Execution-Intent: EXECUTE') }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.request.outputs.commit_sha }}
      canonical_issue: ${{ steps.request.outputs.canonical_issue }}
      vps_required: ${{ steps.authorization.outputs.vps_required }}
      ubuntu_worker_required: ${{ steps.authorization.outputs.ubuntu_worker_required }}
      windows_worker_required: ${{ steps.authorization.outputs.windows_worker_required }}
    steps:
      - name: Check out default branch execution tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Parse exact three-line execution request
        id: request
        run: |
          set -euo pipefail
          python scripts/release/parse_runtime_execution_request.py \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT" \
            --evidence-output runtime-execution-request.json
      - name: Independently verify durable authorization and execution intent
        id: authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.request.outputs.commit_sha }}
          CANONICAL_ISSUE: ${{ steps.request.outputs.canonical_issue }}
        run: |
          set -euo pipefail
          python scripts/release/verify_production_authorization.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$DEPLOY_SHA" \
            --issue "$CANONICAL_ISSUE" \
            --require-execution-intent \
            --github-output "$GITHUB_OUTPUT" \
            --evidence-output production-authorization.json
      - name: Require at least one supported runtime contour
        env:
          VPS_REQUIRED: ${{ steps.authorization.outputs.vps_required }}
          UBUNTU_REQUIRED: ${{ steps.authorization.outputs.ubuntu_worker_required }}
          WINDOWS_REQUIRED: ${{ steps.authorization.outputs.windows_worker_required }}
        run: |
          set -euo pipefail
          if [[ "$VPS_REQUIRED" != "true" && "$UBUNTU_REQUIRED" != "true" && "$WINDOWS_REQUIRED" != "true" ]]; then
            echo "No runtime contour is declared REQUIRED by the exact Change Contract" >&2
            exit 1
          fi

  deploy-vps:
    name: Execute authorized VPS contour
    needs: request
    if: ${{ needs.request.outputs.vps_required == 'true' }}
    uses: ./.github/workflows/deploy-vps.yml
    with:
      commit_sha: ${{ needs.request.outputs.commit_sha }}
      canonical_issue: ${{ fromJSON(needs.request.outputs.canonical_issue) }}
    secrets: inherit

  deploy-ubuntu-worker:
    name: Execute authorized Ubuntu Worker contour
    needs: request
    if: ${{ needs.request.outputs.ubuntu_worker_required == 'true' }}
    uses: ./.github/workflows/deploy-ubuntu-worker.yml
    with:
      commit_sha: ${{ needs.request.outputs.commit_sha }}
      canonical_issue: ${{ fromJSON(needs.request.outputs.canonical_issue) }}
    secrets: inherit

  windows-worker-fallback:
    name: Windows Worker automation capability check
    needs: request
    if: ${{ needs.request.outputs.windows_worker_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed until Windows execution automation is implemented
        run: |
          echo "Windows Worker is REQUIRED but this delivery-automation outcome does not add Windows production execution." >&2
          echo "Use the repository-declared one-command fallback for that contour; do not infer completion from VPS/Ubuntu success." >&2
          exit 1
