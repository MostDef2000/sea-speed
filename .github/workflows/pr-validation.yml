name: PR Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Validate pull request Change Contract
        if: github.event_name == 'pull_request'
        run: python scripts/ci/validate_change_contract.py --event "$GITHUB_EVENT_PATH"

      - name: Validate SDD artifacts
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/ci/validate_sdd.py --event "$GITHUB_EVENT_PATH"
          else
            python scripts/ci/validate_sdd.py
          fi

      - name: Validate repository
        run: python scripts/ci/validate_repo.py

      - name: Validate contracts
        run: python scripts/ci/validate_contracts.py

      - name: Validate schemas
        run: |
          python -m json.tool schemas/release-manifest.schema.json >/dev/null
          python -m json.tool schemas/deployment-manifest.schema.json >/dev/null
          python -m json.tool schemas/telemetry.schema.json >/dev/null

      - name: Validate runtime evidence tooling
        run: python -m py_compile scripts/ci/validate_telemetry.py scripts/operations/verify_runtime.py

      - name: Run behavioral contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
