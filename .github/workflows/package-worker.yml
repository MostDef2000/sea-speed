name: Package Windows Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/package-worker.yml"
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/package-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sea-speed-worker-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Resolve exact package source
        id: provenance
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "Worker package source must be an exact lowercase full Git SHA"
          }
          "source_sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate worker PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('worker/update_worker.ps1', 'worker/run_worker_once.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Validate worker Python syntax
        shell: pwsh
        run: python -m py_compile worker/hls_motion_yolo_worker_events.py worker/hls_motion_yolo_runtime.py

      - name: Build exact-commit worker package
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.provenance.outputs.source_sha }}
        run: |
          $packageDir = Join-Path $PWD 'dist/sea-speed-worker'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          $managedFiles = @(
            'hls_motion_yolo_worker_events.py',
            'hls_motion_yolo_runtime.py',
            'README.txt',
            'start_worker.cmd',
            'stop_worker.cmd',
            'restart_worker.cmd',
            'status_worker.cmd',
            'run_event_worker_forever.cmd',
            'run_worker_once.ps1',
            'update_worker.ps1',
            'update_worker.cmd'
          )

          foreach ($file in $managedFiles) {
            $source = Join-Path 'worker' $file
            if (-not (Test-Path $source -PathType Leaf)) {
              throw "Missing managed worker file: $file"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $packageDir $file) -Force
          }

          Set-Content -LiteralPath (Join-Path $packageDir 'commit-sha.txt') -Value $env:SOURCE_SHA -Encoding ascii
          Compress-Archive -Path "$packageDir/*" -DestinationPath 'dist/sea-speed-worker.zip' -Force
          $hash = (Get-FileHash -LiteralPath 'dist/sea-speed-worker.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'dist/sea-speed-worker.zip.sha256' -Value "$hash  sea-speed-worker.zip" -Encoding ascii

      - name: Upload worker package provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sea-speed-worker-${{ steps.provenance.outputs.source_sha }}
          path: |
            dist/sea-speed-worker.zip
            dist/sea-speed-worker.zip.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Package summary
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.provenance.outputs.source_sha }}
        run: |
          $checksum = Get-Content 'dist/sea-speed-worker.zip.sha256' -Raw
          '### Sea Speed Windows worker package' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ('- Commit: `{0}`' -f $env:SOURCE_SHA) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ('- SHA-256: `{0}`' -f $checksum.Trim()) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '- State: `packaged` (pre-release; not installed)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '- Production release manifest: `NOT BUILT` (requires a real production safety envelope)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '- Target: `D:\sea-speed`' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '- Runtime secrets: loaded from preserved local `.env`' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '- Preserved: `.env`, `.venv`, `output`, models, patch files and local backups' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
