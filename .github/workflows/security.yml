name: Security gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.0 (checksum verified)
        run: |
          curl -fsSL -o gitleaks_8.30.0_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks_8.30.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Gitleaks full-history secret scan
        run: ./gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif --redact -v

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.sarif
          retention-days: 14

  dependency-audit:
    name: pip-audit worker runtime requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit pinned worker runtime requirements
        run: pip-audit -r deploy/worker/ubuntu/requirements-runtime.txt

      - name: Audit pinned API requirements
        run: pip-audit -r api/requirements-api.txt

      - name: Audit hash-locked worker runtime dependency graph
        run: pip-audit --disable-pip -r deploy/worker/ubuntu/requirements-runtime.lock.txt --format json --output pip-audit-worker-lock.json

      - name: Audit hash-locked API dependency graph
        run: pip-audit --disable-pip -r api/requirements-api.lock.txt --format json --output pip-audit-api-lock.json

      - name: Upload pip-audit JSON reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pip-audit-reports-${{ github.sha }}
          path: |
            pip-audit-api-lock.json
            pip-audit-worker-lock.json
          retention-days: 14

      - name: "Negative self-test: known-vulnerable pin must fail the audit"
        # requests==2.20.0 is a transitive dependency pin published with known
        # CVEs (e.g. CVE-2018-18074, CVE-2023-32681), so auditing it must exit
        # non-zero. An unexpectedly clean audit here means this gate is a no-op,
        # which is exactly what this step fails on.
        run: |
          set -euo pipefail
          self_test_req="$(mktemp)"
          trap 'rm -f "$self_test_req"' EXIT
          printf 'requests==2.20.0\n' > "$self_test_req"
          if pip-audit --disable-pip -r "$self_test_req" --format json --output pip-audit-selftest.json; then
            echo "negative self-test failed: pip-audit reported requests==2.20.0 as clean" >&2
            exit 1
          fi

  security-result:
    name: security-result
    if: always()
    needs:
      - secret-scan
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require both security scanners to succeed
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          set -euo pipefail
          printf 'secret-scan=%s\n' "$SECRET_SCAN_RESULT"
          printf 'dependency-audit=%s\n' "$DEPENDENCY_AUDIT_RESULT"
          [[ "$SECRET_SCAN_RESULT" == success ]]
          [[ "$DEPENDENCY_AUDIT_RESULT" == success ]]
