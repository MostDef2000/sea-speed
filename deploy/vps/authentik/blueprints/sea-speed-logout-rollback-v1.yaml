version: 1
metadata:
  name: Sea Speed Logout Rollback v1

entries:
  # Restore the exact provider invalidation flow that was active before
  # Issue #152. This rollback is intentionally limited to the Sea Speed
  # Proxy Provider and does not modify the global default flow itself.
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: Provider for Sea Speed
    attrs:
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
