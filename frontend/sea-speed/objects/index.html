<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031624">
<title>Sea Speed Objects</title>
<style>
:root{color-scheme:dark;--bg:#020b13;--panel:#071d2de8;--border:#81d5e02e;--strong:#6fe7dc5c;--text:#edfaff;--muted:#93b8c5;--cyan:#5eead4;--blue:#62b6ff;--good:#4ade80;--bad:#fb7185;--warn:#fbbf24}*{box-sizing:border-box}html{background:var(--bg)}body{min-height:100vh;margin:0;background:radial-gradient(circle at 10% 4%,#37d6cc1f,transparent 34rem),radial-gradient(circle at 90% 0,#3e84c929,transparent 38rem),linear-gradient(155deg,#020b13,#041827 48%,#03121e);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{min-height:44px;border:1px solid var(--border);border-radius:12px;background:#082234e0;color:var(--text);cursor:pointer}button:hover,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #5eead46b;outline-offset:2px}.shell{width:min(1500px,100%);margin:auto;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}.header-brand{display:flex;align-items:flex-start;gap:14px;min-width:0}.header-copy{min-width:0}.project-home{display:grid;place-items:center;flex:0 0 auto;width:48px;height:48px;border:1px solid var(--strong);border-radius:15px;background:#082234e0;text-decoration:none;box-shadow:0 12px 30px #0006}.project-home:hover{background:#0d354bf5}.project-lighthouse{display:block;width:34px;height:34px}.header-actions{display:grid;gap:9px;justify-items:end;min-width:0}.session-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}.session-login{display:grid;gap:1px;max-width:320px;padding:7px 10px;border:1px solid var(--border);border-radius:12px;background:#041826d1}.session-label{color:var(--muted);font-size:.56rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.session-user{overflow:hidden;font-size:.78rem;text-overflow:ellipsis;white-space:nowrap}.session-user.bad{color:var(--bad)}.logout-link{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:7px 12px;border:1px solid #fb718557;border-radius:12px;background:#7f1d1d2b;color:#fecdd3;font-size:.74rem;font-weight:800;text-decoration:none;white-space:nowrap}.logout-link:hover{background:#7f1d1d55}.eyebrow{margin:0 0 6px;color:var(--cyan);font-size:.7rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,3rem);line-height:1;letter-spacing:-.045em}.subtitle{margin:0;color:var(--muted);line-height:1.45}.back-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:12px;color:var(--text);text-decoration:none;background:#082234e0;white-space:nowrap}.panel{border:1px solid var(--border);border-radius:20px;background:linear-gradient(155deg,#092334e8,#041421f2);box-shadow:0 22px 60px #00070c66}.filters{display:grid;grid-template-columns:1.35fr repeat(2,minmax(155px,.75fr)) repeat(2,minmax(120px,.55fr)) minmax(140px,.65fr) auto;gap:10px;padding:14px;margin-bottom:14px;align-items:end}.field{display:grid;gap:6px}.field label{color:var(--muted);font-size:.68rem;font-weight:800;text-transform:uppercase}.field input,.field select,.edit-form input,.edit-form select,.edit-form textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--border);border-radius:11px;background:#010c15db;color:var(--text)}.field input::placeholder,.edit-form textarea::placeholder{color:#7195a2}.filter-actions{display:flex;gap:8px}.primary{color:var(--good);border-color:#4ade8057;background:#1665342b}.danger{color:var(--bad);border-color:#fb718557;background:#7f1d1d2b}.ghost{color:var(--muted)}.summary-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 2px 12px;color:var(--muted);font-size:.78rem}.objects-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.object-card{overflow:hidden}.object-photo{position:relative;aspect-ratio:704/576;background:#01060a;border-bottom:1px solid var(--border)}.object-photo img{display:block;width:100%;height:100%;object-fit:cover}.photo-empty{display:grid;place-items:center;width:100%;height:100%;color:var(--muted);font-size:.75rem}.speed-badge,.status-badge{position:absolute;top:10px;padding:6px 9px;border-radius:999px;background:#010d15d9;border:1px solid #a7f3eb33;font-size:.7rem;font-weight:800}.speed-badge{left:10px;color:var(--cyan)}.status-badge{right:10px}.status-new{color:var(--warn)}.status-reviewed{color:var(--good)}.status-ignored{color:var(--muted)}.object-body{padding:13px}.object-title{display:flex;justify-content:space-between;gap:10px;align-items:start}.object-title h2{margin:0;font-size:1rem}.object-id{max-width:60%;overflow:hidden;color:var(--muted);font:600 .65rem/1.4 ui-monospace,Consolas,monospace;text-overflow:ellipsis;white-space:nowrap}.object-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0;color:var(--muted);font-size:.72rem}.meta-value{display:block;margin-top:2px;color:var(--text);font-weight:750}.comment-preview{min-height:40px;margin:0 0 12px;color:#cfe8ef;font-size:.74rem;line-height:1.45;white-space:pre-wrap}.card-actions{display:flex;gap:8px}.card-actions button{flex:1}.empty,.error{padding:36px;text-align:center;color:var(--muted)}.error{color:var(--bad)}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px}.pager button{min-width:110px}.pager span{min-width:120px;text-align:center;color:var(--muted);font-size:.78rem}.modal-backdrop{position:fixed;z-index:20;inset:0;display:none;place-items:center;padding:18px;background:#000b0fd9}.modal-backdrop.open{display:grid}.modal{width:min(960px,100%);max-height:calc(100vh - 36px);overflow:auto;border:1px solid var(--strong);border-radius:22px;background:#031522;box-shadow:0 30px 100px #000}.modal-header{position:sticky;z-index:2;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:#031522f2}.modal-header h2{margin:0;font-size:1.1rem}.close-btn{width:44px;padding:0}.modal-content{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:16px;padding:16px}.detail-photo{overflow:hidden;min-height:300px;border:1px solid var(--border);border-radius:16px;background:#01060a}.detail-photo img{display:block;width:100%;height:100%;object-fit:contain}.detail-json{max-height:220px;overflow:auto;padding:10px;border:1px solid var(--border);border-radius:12px;background:#00080fd6;color:#cdeff7;font:.65rem/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}.edit-form{display:grid;gap:11px}.edit-form label{display:grid;gap:6px;color:var(--muted);font-size:.7rem;font-weight:800;text-transform:uppercase}.edit-form textarea{min-height:130px;resize:vertical}.edit-actions{display:flex;gap:8px}.edit-actions button{flex:1}.toast{position:fixed;z-index:40;right:18px;bottom:18px;max-width:min(420px,calc(100vw - 36px));padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#041725f2;box-shadow:0 20px 50px #0008;color:var(--text);opacity:0;transform:translateY(10px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}.toast.bad{color:var(--bad)}
@media(max-width:1200px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filter-actions{grid-column:span 3}.objects-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}.topbar{display:grid}.header-brand{gap:10px}.project-home{width:44px;height:44px;border-radius:13px}.project-lighthouse{width:31px;height:31px}.header-actions{justify-items:start;width:100%}.session-bar{width:100%;align-items:stretch}.session-login{min-width:0;flex:1}.logout-link{flex:0 0 auto}.back-link{justify-self:start}.filters{grid-template-columns:1fr}.filter-actions{grid-column:auto}.objects-grid{grid-template-columns:1fr}.modal-content{grid-template-columns:1fr}.detail-photo{min-height:220px}input,select,textarea{font-size:16px}.summary-row{align-items:flex-start;flex-direction:column}}@media(max-width:390px){.session-label{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<div class="header-brand">
<a class="project-home" href="/" aria-label="На главную mostdef.ru" title="mostdef.ru"><svg class="project-lighthouse" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#ffe59a" opacity=".28" d="M27 8 47 3v11z"/><path fill="#d24f49" d="M14 13h20v5H14z"/><path fill="#ffe59a" d="M18 6h12v7H18z"/><path fill="#d24f49" d="m17 18-3 23h20l-3-23z"/><path fill="#edf8f6" d="M16 25h16l-1 8H15z"/><path fill="#91e6df" d="M11 41h26v3H11z"/></svg></a>
<div class="header-copy"><p class="eyebrow">Sea Speed · persistent registry</p><h1>Объекты</h1><p class="subtitle">Сохранённые детекции скорости, фотографии и операторская обработка.</p></div>
</div>
<div class="header-actions">
<div class="session-bar" aria-label="Сессия пользователя"><span class="session-login"><span class="session-label">Пользователь</span><strong id="sessionUser" class="session-user">…</strong></span><a class="logout-link" href="/outpost.goauthentik.io/sign_out">Выйти</a></div>
<a class="back-link" href="/sea-speed/">← Операторский экран</a>
</div>
</header>
<form id="filters" class="panel filters">
<div class="field"><label for="searchInput">Поиск</label><input id="searchInput" name="search" placeholder="ID, класс или комментарий"></div>
<div class="field"><label for="dateFromInput">С даты</label><input id="dateFromInput" name="date_from" type="datetime-local"></div>
<div class="field"><label for="dateToInput">По дату</label><input id="dateToInput" name="date_to" type="datetime-local"></div>
<div class="field"><label for="speedMinInput">Скорость от</label><input id="speedMinInput" name="speed_min" type="number" min="0" step="0.1" placeholder="km/h"></div>
<div class="field"><label for="speedMaxInput">Скорость до</label><input id="speedMaxInput" name="speed_max" type="number" min="0" step="0.1" placeholder="km/h"></div>
<div class="field"><label for="statusInput">Статус</label><select id="statusInput" name="status"><option value="">Все</option><option value="new">Новый</option><option value="reviewed">Проверен</option><option value="ignored">Игнорировать</option></select></div>
<div class="filter-actions"><button class="primary" type="submit">Применить</button><button id="resetBtn" class="ghost" type="button">Сбросить</button></div>
</form>
<div class="summary-row"><div id="summary">Загрузка…</div><div>Camera 1 · SQLite registry</div></div>
<section id="objectsGrid" class="objects-grid" aria-live="polite"><div class="panel empty">Загрузка объектов…</div></section>
<nav class="pager" aria-label="Пагинация"><button id="prevBtn" type="button">← Назад</button><span id="pageInfo">Страница 1</span><button id="nextBtn" type="button">Вперёд →</button></nav>
</main>
<div id="modalBackdrop" class="modal-backdrop" role="presentation">
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<header class="modal-header"><h2 id="modalTitle">Объект</h2><button id="closeBtn" class="close-btn" type="button" aria-label="Закрыть">×</button></header>
<div class="modal-content">
<div><div id="detailPhoto" class="detail-photo"></div><h3>Исходные данные события</h3><pre id="detailJson" class="detail-json">{}</pre></div>
<form id="editForm" class="edit-form">
<label>ID объекта<input id="editObjectId" readonly></label>
<label>Класс<input id="editClassName" maxlength="80" required></label>
<label>Скорость, km/h<input id="editSpeed" type="number" min="0" step="0.1"></label>
<label>Статус<select id="editStatus"><option value="new">Новый</option><option value="reviewed">Проверен</option><option value="ignored">Игнорировать</option></select></label>
<label>Комментарий<textarea id="editComment" maxlength="2000" placeholder="Комментарий оператора"></textarea></label>
<div class="edit-actions"><button class="primary" type="submit">Сохранить</button><button id="deleteBtn" class="danger" type="button">Удалить</button></div>
</form>
</div>
</section>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
const SESSION_URL="/sea-speed/api/session";
const OBJECTS_URL="/sea-speed/api/cam1/objects";
const PAGE_SIZE=24;
const $=id=>document.getElementById(id);
const sessionUser=$("sessionUser"),filters=$("filters"),objectsGrid=$("objectsGrid"),summary=$("summary"),prevBtn=$("prevBtn"),nextBtn=$("nextBtn"),pageInfo=$("pageInfo"),modalBackdrop=$("modalBackdrop"),closeBtn=$("closeBtn"),editForm=$("editForm"),deleteBtn=$("deleteBtn"),toast=$("toast");
let offset=0,total=0,currentObject=null,toastTimer=null;
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const formatDate=value=>{if(!value)return "—";let date=new Date(value);return Number.isNaN(date.getTime())?value:date.toLocaleString()};
const formatSpeed=value=>value==null?"—":`${Number(value).toFixed(1)} km/h`;
const statusLabel=value=>({new:"Новый",reviewed:"Проверен",ignored:"Игнорировать"})[value]||value||"—";
async function loadSessionIdentity(){try{let response=await fetch(SESSION_URL,{cache:"no-store",credentials:"same-origin"}),body={};try{body=await response.json()}catch(_error){}let username=String(body.username||"").trim();if(!response.ok||!username)throw Error("trusted identity unavailable");sessionUser.textContent=username;sessionUser.classList.remove("bad")}catch(_error){sessionUser.textContent="недоступно";sessionUser.classList.add("bad")}}
function showToast(message,bad=false){clearTimeout(toastTimer);toast.textContent=message;toast.className=`toast show${bad?" bad":""}`;toastTimer=setTimeout(()=>toast.className="toast",2600)}
function filterParams(){let data=new FormData(filters),params=new URLSearchParams({limit:String(PAGE_SIZE),offset:String(offset)});for(let [key,value] of data.entries()){value=String(value).trim();if(!value)continue;if((key==="date_from"||key==="date_to")&&value){let date=new Date(value);if(!Number.isNaN(date.getTime()))value=date.toISOString()}params.set(key,value)}return params}
async function request(url,options={}){let response=await fetch(url,{cache:"no-store",credentials:"same-origin",...options});if(!response.ok){let body=await response.text();try{body=JSON.parse(body).detail||body}catch(_error){}throw Error(`${response.status}: ${body}`)}return response.json()}
function photoMarkup(object,className=""){return object.snapshot_url?`<img class="${className}" src="${escapeHtml(object.snapshot_url)}" alt="Детекция ${escapeHtml(object.object_id)}">`:'<div class="photo-empty">Фотография отсутствует</div>'}
function renderObjects(objects){if(!objects.length){objectsGrid.innerHTML='<div class="panel empty">По выбранным условиям объектов нет.</div>';return}objectsGrid.innerHTML=objects.map(object=>`<article class="panel object-card" data-object-id="${escapeHtml(object.object_id)}"><div class="object-photo">${photoMarkup(object)}<span class="speed-badge">${escapeHtml(formatSpeed(object.speed_kmh))}</span><span class="status-badge status-${escapeHtml(object.status)}">${escapeHtml(statusLabel(object.status))}</span></div><div class="object-body"><div class="object-title"><h2>${escapeHtml(object.class_name||"object")}</h2><div class="object-id" title="${escapeHtml(object.object_id)}">${escapeHtml(object.object_id)}</div></div><div class="object-meta"><div>Дата<span class="meta-value">${escapeHtml(formatDate(object.detected_at))}</span></div><div>Track ID<span class="meta-value">${escapeHtml(object.track_id??"—")}</span></div><div>Confidence<span class="meta-value">${object.confidence==null?"—":escapeHtml(Number(object.confidence).toFixed(2))}</span></div><div>Обновлено<span class="meta-value">${escapeHtml(formatDate(object.updated_at))}</span></div></div><p class="comment-preview">${escapeHtml(object.comment||"Комментария нет")}</p><div class="card-actions"><button class="primary open-object" type="button">Открыть</button></div></div></article>`).join("");objectsGrid.querySelectorAll(".open-object").forEach(button=>button.addEventListener("click",()=>openObject(button.closest("[data-object-id]").dataset.objectId)))}
function updatePager(){let page=Math.floor(offset/PAGE_SIZE)+1,maxPage=Math.max(1,Math.ceil(total/PAGE_SIZE));pageInfo.textContent=`Страница ${page} из ${maxPage}`;prevBtn.disabled=offset<=0;nextBtn.disabled=offset+PAGE_SIZE>=total}
async function loadObjects(){objectsGrid.innerHTML='<div class="panel empty">Загрузка объектов…</div>';try{let data=await request(`${OBJECTS_URL}?${filterParams()}`);total=data.total||0;summary.textContent=`Найдено: ${total}. Показано: ${data.count||0}.`;renderObjects(data.objects||[]);updatePager()}catch(error){objectsGrid.innerHTML=`<div class="panel error">Ошибка загрузки: ${escapeHtml(error.message)}</div>`;summary.textContent="API недоступен";showToast(error.message,true)}}
async function openObject(objectId){try{let data=await request(`${OBJECTS_URL}/${encodeURIComponent(objectId)}`);currentObject=data.object;$("modalTitle").textContent=`${currentObject.class_name||"object"} · ${formatSpeed(currentObject.speed_kmh)}`;$("detailPhoto").innerHTML=photoMarkup(currentObject,"detail-image");$("detailJson").textContent=JSON.stringify(currentObject.original_event||{},null,2);$("editObjectId").value=currentObject.object_id;$("editClassName").value=currentObject.class_name||"";$("editSpeed").value=currentObject.speed_kmh??"";$("editStatus").value=currentObject.status||"new";$("editComment").value=currentObject.comment||"";modalBackdrop.classList.add("open");document.body.style.overflow="hidden";closeBtn.focus()}catch(error){showToast(error.message,true)}}
function closeModal(){modalBackdrop.classList.remove("open");document.body.style.overflow="";currentObject=null}
filters.addEventListener("submit",event=>{event.preventDefault();offset=0;loadObjects()});
$("resetBtn").addEventListener("click",()=>{filters.reset();offset=0;loadObjects()});
prevBtn.addEventListener("click",()=>{offset=Math.max(0,offset-PAGE_SIZE);loadObjects();scrollTo({top:0,behavior:"smooth"})});
nextBtn.addEventListener("click",()=>{if(offset+PAGE_SIZE<total)offset+=PAGE_SIZE;loadObjects();scrollTo({top:0,behavior:"smooth"})});
closeBtn.addEventListener("click",closeModal);modalBackdrop.addEventListener("click",event=>{if(event.target===modalBackdrop)closeModal()});addEventListener("keydown",event=>{if(event.key==="Escape"&&modalBackdrop.classList.contains("open"))closeModal()});
editForm.addEventListener("submit",async event=>{event.preventDefault();if(!currentObject)return;let speed=$("editSpeed").value.trim();let payload={class_name:$("editClassName").value.trim(),speed_kmh:speed===""?null:Number(speed),status:$("editStatus").value,comment:$("editComment").value};try{let data=await request(`${OBJECTS_URL}/${encodeURIComponent(currentObject.object_id)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});currentObject=data.object;showToast("Изменения сохранены");closeModal();loadObjects()}catch(error){showToast(error.message,true)}});
deleteBtn.addEventListener("click",async()=>{if(!currentObject||!confirm("Удалить запись из рабочего реестра? Фотография останется на сервере."))return;try{await request(`${OBJECTS_URL}/${encodeURIComponent(currentObject.object_id)}`,{method:"DELETE"});showToast("Запись удалена");closeModal();if(offset>=Math.max(0,total-1)&&offset>0)offset=Math.max(0,offset-PAGE_SIZE);loadObjects()}catch(error){showToast(error.message,true)}});
loadSessionIdentity();
loadObjects();
</script>
</body>
</html>
