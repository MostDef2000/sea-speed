<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sea Speed — прототип компьютерного зрения для обнаружения транспорта и оценки скорости." />
  <title>Sea Speed</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(15, 29, 48, 0.86);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #eef6ff;
      --muted: #9db0c7;
      --accent: #22c55e;
      --accent-strong: #16a34a;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 15%, rgba(34, 197, 94, 0.14), transparent 34rem),
        radial-gradient(circle at 82% 12%, rgba(59, 130, 246, 0.14), transparent 32rem),
        linear-gradient(145deg, #06101d 0%, #0a1728 58%, #07111f 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: auto;
      padding: 48px 0 36px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.72fr);
      gap: 42px;
      align-items: center;
      min-height: 520px;
      padding: clamp(32px, 6vw, 72px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      right: -130px;
      top: -150px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.13);
      filter: blur(4px);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #8de7ad;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(3rem, 9vw, 6.8rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    .lead {
      max-width: 650px;
      margin: 28px 0 34px;
      color: var(--muted);
      font-size: clamp(1.04rem, 2vw, 1.3rem);
      line-height: 1.65;
    }

    .primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 58px;
      padding: 0 28px;
      border-radius: 16px;
      background: var(--accent);
      color: #03140a;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 16px 40px rgba(34, 197, 94, 0.24);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .primary-link:hover,
    .primary-link:focus-visible {
      transform: translateY(-2px);
      background: #32d66d;
      box-shadow: 0 20px 46px rgba(34, 197, 94, 0.3);
    }

    .primary-link:focus-visible,
    .secondary-link:focus-visible {
      outline: 3px solid rgba(147, 197, 253, 0.8);
      outline-offset: 4px;
    }

    .visual {
      position: relative;
      min-height: 310px;
      display: grid;
      place-items: center;
    }

    .radar {
      position: relative;
      width: min(310px, 72vw);
      aspect-ratio: 1;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 50%;
      background:
        linear-gradient(rgba(148, 163, 184, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.12) 1px, transparent 1px),
        radial-gradient(circle, rgba(34, 197, 94, 0.12) 0 1px, transparent 2px),
        rgba(3, 12, 23, 0.65);
      background-size: 50% 50%, 50% 50%, 28px 28px, auto;
      box-shadow: inset 0 0 60px rgba(34, 197, 94, 0.08);
    }

    .radar::before,
    .radar::after {
      content: "";
      position: absolute;
      inset: 17%;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 50%;
    }

    .radar::after {
      inset: 34%;
    }

    .sweep {
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      background: conic-gradient(from 15deg, transparent 0 76%, rgba(34, 197, 94, 0.48) 92%, transparent 100%);
      animation: sweep 5s linear infinite;
    }

    .vehicle {
      position: absolute;
      left: 56%;
      top: 39%;
      width: 86px;
      height: 42px;
      border: 2px solid rgba(238, 246, 255, 0.9);
      border-radius: 11px 15px 9px 9px;
      transform: rotate(-18deg);
      box-shadow: 0 0 28px rgba(34, 197, 94, 0.35);
    }

    .vehicle::before,
    .vehicle::after {
      content: "";
      position: absolute;
      bottom: -8px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #06101d;
      border: 2px solid rgba(238, 246, 255, 0.85);
    }

    .vehicle::before {
      left: 11px;
    }

    .vehicle::after {
      right: 11px;
    }

    .metric {
      position: absolute;
      right: 3%;
      bottom: 4%;
      padding: 12px 15px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: rgba(4, 14, 27, 0.82);
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }

    .metric strong {
      display: block;
      margin-top: 3px;
      color: var(--text);
      font-size: 1.22rem;
    }

    footer {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0 0 24px;
      text-align: center;
    }

    .secondary-link {
      color: rgba(157, 176, 199, 0.72);
      font-size: 0.78rem;
      text-decoration: none;
    }

    .secondary-link:hover {
      color: var(--text);
      text-decoration: underline;
    }

    @keyframes sweep {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sweep {
        animation: none;
      }
    }

    @media (max-width: 760px) {
      main {
        padding-top: 24px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 24px;
        min-height: auto;
        border-radius: 22px;
      }

      .visual {
        min-height: 250px;
      }

      .metric {
        right: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Computer vision prototype</p>
        <h1 id="page-title">Sea Speed</h1>
        <p class="lead">
          Обнаружение транспорта, визуальная телеметрия и экспериментальная оценка скорости в одном операторском интерфейсе.
        </p>
        <a class="primary-link" href="/sea-speed/">
          Открыть Sea Speed
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="visual" aria-hidden="true">
        <div class="radar">
          <div class="sweep"></div>
          <div class="vehicle"></div>
          <div class="metric">
            prototype status
            <strong>ONLINE</strong>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a class="secondary-link" href="/cams/">Камеры</a>
  </footer>
</body>
</html>
